[package]
name = "knot"
version = "0.0.1"
description = "KNOT is Not Only Typora — open-source vibe-coded Markdown editor for macOS."
authors = ["KTTRCDL"]
edition = "2021"

[lib]
name = "knot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

